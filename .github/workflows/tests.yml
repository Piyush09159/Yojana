name: Offline tests

on:
  push:
    branches: [main, refactor]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      # pdf_service tests use a fake renderer: only its two pure-Python template/QR libraries are needed
      - run: python -m pip install jinja2==3.1.6 segno==1.6.6
      - run: python -m pip check
      - run: python -m pytest -q
